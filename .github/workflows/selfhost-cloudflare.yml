name: Deploy OpenSEO to Cloudflare

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Bootstrap or refresh the Alchemy state store (enable for the first run)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: open-seo-selfhost-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Bootstrap and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATAFORSEO_API_KEY: ${{ secrets.DATAFORSEO_API_KEY }}
      ACCESS_ALLOWED_EMAILS: ${{ secrets.ACCESS_ALLOWED_EMAILS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATAFORSEO_API_KEY ACCESS_ALLOWED_EMAILS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Create temporary self-host configuration
        shell: bash
        run: |
          umask 077
          {
            printf 'DATAFORSEO_API_KEY=%s\n' "$DATAFORSEO_API_KEY"
            printf 'ACCESS_ALLOWED_EMAILS=%s\n' "$ACCESS_ALLOWED_EMAILS"
            printf 'OPENSEO_TELEMETRY_DISABLED=1\n'
          } > .env.selfhost
          chmod 600 .env.selfhost

      - name: Bootstrap Alchemy state store
        if: ${{ inputs.bootstrap == true }}
        run: pnpm alchemy cloudflare bootstrap

      - name: Deploy OpenSEO
        run: pnpm deploy:selfhost --yes

      - name: Remove temporary configuration
        if: always()
        shell: bash
        run: rm -f .env.selfhost
